# Kommt in JEDES Plugin-Repo unter .github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:   # erlaubt manuelles Starten ueber den Actions-Tab

jobs:
  build:
    # WICHTIG: uses steht auf JOB-Ebene, nicht bei den steps.
    # Format: <org>/<repo>/.github/workflows/<datei>.yml@<ref>
    uses: HXO-Development/hxo-workflows/.github/workflows/build-publish-release-gradle.yml@v1
    with:
      java-version: "21"
      modules: "hxo-projekt-paper-*-all.jar;hxo-projekt-velocity-*-all.jar"
    secrets: inherit
    # Alternativ explizit, wenn du nicht alle Secrets durchreichen willst:
    # secrets:
    #   REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
    #   REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
